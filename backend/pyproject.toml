[project]
name = "nota-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Versi dikunci di requirements.txt (dipakai Docker dan CI). Daftar ini untuk pip install -e.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "google-genai",
    "firebase-admin",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
eval = ["pillow", "pyarrow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
