name: android

on:
  push:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "shared/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", "shared/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Juga memvalidasi gradle-wrapper.jar terhadap checksum resmi Gradle.
      - uses: gradle/actions/setup-gradle@v4
      # Tanpa google-services.json: Firebase tidak dipasang, build tetap jalan.
      - name: Build, unit test (termasuk vektor uji bersama), lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laporan
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
